name: Bug report
description: Report a problem with the app
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security issues**, do not file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ... I expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Go to ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Demo role used
      options: [Admin, Manager, User, Viewer, N/A]
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, commit SHA
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console logs
